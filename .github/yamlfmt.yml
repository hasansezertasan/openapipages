---
formatter:
  type: basic
  include_document_start: true
  pad_line_comments: 2
  # Blank lines are deliberate structure in long workflows (one per job, one per
  # logical step group), so keep them instead of letting the basic formatter drop
  # every one. `_single` (not `retain_line_breaks`) collapses runs of blank lines
  # to exactly one, which keeps the formatter idempotent.
  retain_line_breaks_single: true
