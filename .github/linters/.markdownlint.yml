---
default: true
# MD003/heading-style - Heading style
MD003:
  style: atx
# MD004/ul-style - Unordered list style
MD004:
  style: dash
# MD007/ul-indent - Unordered list indentation
MD007:
  indent: 2
# MD013/line-length - Line length
MD013: false
# MD024/no-duplicate-heading - Multiple headings with the same content
MD024: false
# MD025/single-title - Multiple top-level headings in the same document
MD025:
  front_matter_title: ""
# MD033/no-inline-html - Inline HTML
MD033:
  allowed_elements: ["br", "details", "summary"]
# MD046/code-block-style - Code block style
MD046:
  style: fenced
# MD060/table-column-style - Table column style
#
# Disabled because its autofix corrupts valid tables (issue #276), and
# `.markdownlint-cli2.jsonc` sets `fix: true`, so the damage lands silently on
# every commit. MD060 rewrites the delimiter row to pad its pipes; on a compact
# row that starts without a leading pipe (`-|:-:|---`) the padded result
# (`- | :-: | ---`) is a bullet list item, so the table stops being a table and
# renders as paragraph text. The rule only enforces cosmetic pipe spacing, so
# there is nothing to keep in report-only mode either.
MD060: false
