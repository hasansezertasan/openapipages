---
name: Bug report
description: Report a defect in openapipages
title: 'Bug: '
labels: ['bug']
assignees:
  - 'hasansezertasan'
body:
  - type: markdown
    attributes:
      value: >-
        This tracker is for bugs in `openapipages` itself. Please use [Discussions](https://github.com/hasansezertasan/openapipages/discussions) for questions about your own code.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The installed `openapipages` package version.
      placeholder: 'e.g. 0.2.x'
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >-
        Minimal, complete steps that let a maintainer reproduce the bug. See https://stackoverflow.com/help/minimal-reproducible-example for guidance.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or logs
      description: Paste the full traceback if an exception was raised.
      render: text
    validations:
      required: false
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: '3.12'
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: 'Windows 11, macOS 14, Ubuntu 24.04'
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - pip
        - uv
        - uvx
        - pipx
        - from source
        - other
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
