---
name: Prek Checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      # basedpyright needs project deps importable to resolve third-party
      # symbols. Run prek inside the uv-managed venv so site-packages is
      # populated; the wrapped prek-action runs in an isolated env that
      # cannot see uv's venv.
      - name: Sync dependencies
        # --all-extras pulls the optional `otel` group so basedpyright can
        # resolve the soft-imported OpenTelemetry symbols in factory.py.
        run: uv sync --all-groups --all-extras --frozen
      - name: Run prek
        # no-commit-to-branch guards local commits; on a push to main it
        # always fails because CI checks out main itself.
        env:
          SKIP: no-commit-to-branch
        run: uv run --with prek prek run --all-files --show-diff-on-failure
